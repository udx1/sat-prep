<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT Prep Hub</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 24px 0 24px;
            flex-shrink: 0;
        }

        .header-title {
            font-size: 1.5rem;
            margin: 0 0 16px 0;
            font-weight: 700;
        }

        /* Nav Tabs */
        .nav-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .tab-btn {
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            border: 1px solid transparent;
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            background-color: #f1f5f9;
            color: #64748b;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        .tab-btn.active {
            background-color: var(--bg-color);
            color: var(--primary-color);
            border-color: var(--border-color);
            font-weight: 700;
        }

        /* Main Container & Frame */
        .content-container {
            flex: 1;
            width: 100%;
            display: flex;
        }

        iframe {
            width: 100%;
            min-height: calc(100vh - 120px);
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="header-title">🎯 SAT Reading & Writing Master Hub</h1>
        <nav class="nav-tabs">
            <button class="tab-btn active" onclick="loadDomain('standard-english.html', this)">Standard English Conventions</button>
            <button class="tab-btn" onclick="loadDomain('craft-and-structure.html', this)">Craft & Structure</button>
            <button class="tab-btn" onclick="loadDomain('information-and-ideas.html', this)">Information & Ideas</button>
            <button class="tab-btn" onclick="loadDomain('expression-of-ideas.html', this)">Expression of Ideas</button>
        </nav>
    </header>

    <main class="content-container">
        <iframe id="domain-frame" src="standard-english.html" title="SAT Domain Module" onload="adjustFrameHeight(this)"></iframe>
    </main>

    <script>
        function loadDomain(pageUrl, btn) {
            const frame = document.getElementById('domain-frame');
            frame.src = pageUrl;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function adjustFrameHeight(frame) {
            try {
                if (frame.contentWindow && frame.contentWindow.document.body) {
                    const contentHeight = frame.contentWindow.document.body.scrollHeight;
                    if (contentHeight > 0) {
                        frame.style.height = (contentHeight + 40) + 'px';
                    }
                }
            } catch (e) {
                // Fallback height if cross-origin restriction applies
                frame.style.height = 'calc(100vh - 120px)';
            }
        }
    </script>
</body>
</html>
